<title>Réponse rapide · Zenith Dash</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#060a10;--s:#0d1320;--card:#121a28;--c2:#182135;--b:rgba(0,220,100,.14);--line:rgba(255,255,255,.1);--green:#00e080;--red:#ff5f6d;--blue:#7fb2ff;--text:#e8eaf2;--muted:#9aa3c0;--mine:#0f3b27}
html.light{--bg:#f4f6fb;--s:#ffffff;--card:#ffffff;--c2:#eef1f8;--b:rgba(0,100,60,.16);--line:rgba(0,0,0,.12);--green:#00a866;--red:#e0333f;--blue:#2d5fe0;--text:#131a2a;--muted:#5b6475;--mine:#d9f5e7}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button,input{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--c2);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.nm{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.open{margin-left:auto;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none;white-space:nowrap}
.msgs{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;padding:8px 0;min-height:120px}
.bub{max-width:85%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.45;word-wrap:break-word;background:var(--card);border:1px solid var(--line);align-self:flex-start}
.bub.mine{align-self:flex-end;background:var(--mine);border-color:transparent}
.bub .who{font-size:11.5px;font-weight:700;color:var(--green);margin-bottom:2px}
.bub.target{box-shadow:0 0 0 2px var(--green)}
.sheet{background:var(--card);border:1px solid var(--b);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.reacts{display:flex;justify-content:space-between;gap:6px}
.re{flex:1;max-width:52px;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;display:flex;align-items:center;justify-content:center;padding:0}
.re.quick{border-color:var(--green)}
.re:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.inp{flex:1;min-width:0;min-height:46px;border-radius:23px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-size:15px}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:#04120b;display:flex;align-items:center;justify-content:center;flex:none}
.round.rec{background:var(--red);color:#fff}
.round:disabled{opacity:.5}
.recbar{flex:1;display:flex;align-items:center;gap:10px;min-height:46px;border-radius:23px;background:rgba(255,95,109,.12);border:1px solid rgba(255,95,109,.4);padding:0 14px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:b 1s infinite}
@keyframes b{50%{opacity:.3}}
.bars{flex:1;min-width:40px;height:26px;display:flex;align-items:center;justify-content:center;gap:2px}
.bars i{flex:1;max-width:4px;height:100%;border-radius:2px;background:var(--red);transform:scaleY(.14);transform-origin:center;transition:transform 70ms linear}
.recbar .dot{transform:scale(calc(1 + var(--lv,0)*.9));animation:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.bars i{transition:none}}
.cancel{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:700}
.st{font-size:12.5px;color:var(--muted);text-align:center;min-height:18px}
.st.err{color:var(--red)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px 10px}
.done .ok{width:64px;height:64px;border-radius:50%;background:rgba(0,224,128,.14);color:var(--green);display:flex;align-items:center;justify-content:center}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700;text-decoration:none;color:var(--text);display:inline-flex;align-items:center}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><div class="st" id="st"></div></main>
<script src="/js/reponse.js?v=10.0.0"></script>
</body>
