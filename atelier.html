<title>Suivi de réparation · Zenith Dash</title>

<style>
:root{--bg:#060a10;--card:#121a28;--line:rgba(255,255,255,.1);--green:#00e080;--red:#ff5f6d;--amber:#f5a623;--text:#e8eaf2;--muted:#9aa3c0}
@media (prefers-color-scheme:light){:root{--bg:#f4f6fb;--card:#ffffff;--line:rgba(0,0,0,.12);--green:#00a866;--red:#e0333f;--amber:#b7791f;--text:#131a2a;--muted:#5b6475}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.wrap{width:100%;max-width:520px;padding:18px max(16px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.brand{font-size:12px;color:var(--muted);margin-bottom:14px}
.brand b{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted)}
.st{display:inline-block;margin-top:10px;font-weight:800;font-size:15px;color:var(--green)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;position:relative;font-size:14px;color:var(--muted)}
.steps li .d{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:3px}
.steps li.on{color:var(--text)}
.steps li.on .d{background:var(--green);border-color:var(--green)}
.steps li.cur{font-weight:800}
.steps small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:12px;background:var(--green);color:#03140b;font-weight:800;text-decoration:none;margin-top:6px}
.err{color:var(--red);text-align:center;padding:30px 0}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><div class="sub" style="text-align:center;padding:40px 0">…</div></main>
